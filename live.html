ash-1017-singprobe，探针仅 10.10M 参数，读取基座模型第 12、25、39 层隐藏状态，逐 token 输出 8 类查询意图、响应不安全和幻觉风险评分。","source":{"name":"蚂蚁 inclusionAI：HuggingFace 新模型"},"category":"ai-models","score":45,"publishedAt":"2026-11-19T11:02:06.000Z","discoveredAt":"2026-11-19T12:00:23.115Z","selected":false,"links":{"aihot":"https://aihot.news/items/ygbr95lz8wozlf6poq2ymopkk","original":"https://huggingface.co/inclusionAI/DeepSeek-V4.1-Flash-1017-singprobe"}},{"title":"蚂蚁 inclusionAI 发布 Ling-3.1-flash-1019-singprobe 流式安全探针","summary":"蚂蚁 inclusionAI 在 HuggingFace 发布 Ling-3.1-flash-1019-singprobe，这是为 Ling-3.1-flash-1019 打造的流式安全护栏，仅 8.13M 参数，通过读取基座模型第 23、47、71 层隐状态，逐 token 打分查询意图、回复不安全和幻觉风险。","source":{"name":"蚂蚁 inclusionAI：HuggingFace 新模型"},"category":"ai-models","score":44,"publishedAt":"2026-11-19T11:02:34.000Z","discoveredAt":"2026-11-19T12:00:23.104Z","selected":false,"links":{"aihot":"https://aihot.news/items/x56zyon7cd30xnvw6dclracdd","original":"https://huggingface.co/inclusionAI/Ling-3.1-flash-1019-singprobe"}},{"title":"O'Reilly 撰文解析 AI 递归自我改进的四级方法与现实风险","summary":"O'Reilly 发文分析 AI 正在参与构建下一代 AI 的递归自我改进趋势，给出四级框架：改进答案（Reflexion 将 GPT-4 编码测试成绩从 80% 提到 91%）、改写提示词（OPRO）、积累工具箱（Voyager）和修改自身（Darwin Godel Machine 将编码测试从 20% 提到 50%。","source":{"name":"O'Reilly Radar（热点 RSS）"},"category":"opinion","score":62,"publishedAt":"2026-11-19T11:45:40.000Z","discoveredAt":"2026-11-19T11:56:22.996Z","selected":false,"links":{"aihot":"https://aihot.news/items/dlgfzw8jcv2mwu7xmggntegld","original":"https://www.oreilly.com/radar/who-builds-the-next-model/"}},{"title":"多家银行警告 AI 智能体操作损失可能由用户自己承担","summary":"多家大型银行近期向客户警告，AI 智能体获授权访问金融账户后执行的操作可能被视为用户本人行为，损失需用户自担。Ally Bank、摩根大通、花旗分别通过邮件和应用提示说明 AI 可能犯错或产生幻觉，已授权交易或无法撤销；银行还提醒用户不要交出登录凭据。","source":{"name":"IT之家·人工智能"},"category":"industry","score":68,"publishedAt":"2026-11-19T10:59:24.937Z","discoveredAt":"2026-11-19T11:27:21.875Z","selected":false,"links":{"aihot":"https://aihot.news/items/e6nxncm2hzubo4kbzk0t4b9vx","original":"https://www.ithome.com/1/029/646.htm"}},{"title":"IMF 总裁警告 AI 投资热情过高，金融市场或进一步调整","summary":"IMF 总裁格奥尔基耶娃在深圳接受彭博电视台采访时表示，投资者对 AI 的热情过高，金融市场可能还会出现进一步调整，有助于回到更可持续的状态。她透露 AI 产业循环融资规模约 1 万亿美元，约三分之二来自债务融资，增长速度和融资结构从股权转向债务的趋势可能带来金融稳定风险。","source":{"name":"IT之家·人工智能"},"category":"opinion","score":68,"publishedAt":"2026-11-19T11:17:05.367Z","discoveredAt":"2026-11-19T11:27:21.869Z","selected":false,"links":{"aihot":"https://aihot.news/items/tjw6bkuivj4tfe17eclbed367","original":"https://www.ithome.com/1/029/648.htm"}},{"title":"马斯克：SpaceX 目前每月新增约 0.5GW AI 算力，明年底提速至每月 1GW","summary":"马斯克称 SpaceX 目前每月约新增 0.5GW AI 算力，大致相当于部署 22 万颗 GB300 芯片及配套 CPU、网络设备、冷却系统等基础设施。他认为真正的扩张瓶颈在发电端，明年将进一步提速，到明年底每月新增 AI 算力超 1GW。","source":{"name":"IT之家·人工智能"},"category":"opinion","score":48,"publishedAt":"2026-11-19T11:17:43.280Z","discoveredAt":"2026-11-19T11:27:21.863Z","selected":false,"links":{"aihot":"https://aihot.news/items/ul9i47wikooyrlpie1zs1yoxe","original":"https://www.ithome.com/1/029/649.htm"}},{"title":"AI 攻击时代的四支柱安全事件响应指南：从 Fireworks AI 到 Klue 的实践复盘","summary":"文章指出 AI 驱动的攻击正以机器速度、全球规模加速，并梳理 2026 年 5 月至 11 月多起 AI 平台披露的安全事件，受影响对象包括 npm/PyPI 上的 Mistral AI 等 SDK、Klue、Fireworks AI、Cursor、Railway 和 Warp 等平台，共同焦点是被存储的环境变量与 API 密钥。","source":{"name":"MarkTechPost（RSS）"},"category":"industry","score":69,"publishedAt":"2026-11-19T10:45:57.000Z","discoveredAt":"2026-11-19T11:15:21.823Z","selected":false,"links":{"aihot":"https://aihot.news/items/r913g91b5qqvenqikr079hxqu","original":"https://www.marktechpost.com/2026/11/19/ai-security-incident-response-playbook-2026/"}},{"title":"德国 BSI 将网络威胁评估上调为严峻至危急，指出 AI 智能体降低攻击门槛","summary":"德国联邦信息安全局（BSI）11 月 19 日发布年度报告，将信息技术系统威胁评估从去年的严峻上调为严峻至危急，理由是智能体 AI 系统让攻击者更容易发现和利用漏洞。其网络安全指数从 2025 年年中的 124 点升至今年年中的 238 点；报告称攻击越来越快、便宜且有针对性，攻击者开始借助 AI 模型直接攻击系统，并警告许多企业尤其是中小企业防御动作太慢，未在受攻击前用 AI 排查漏洞。","source":{"name":"IT之家·人工智能"},"category":"industry","score":59,"publishedAt":"2026-11-19T10:00:25.320Z","discoveredAt":"2026-11-19T10:45:22.141Z","selected":false,"links":{"aihot":"https://aihot.news/items/dcksom1umnwz3tza055ltzpch","original":"https://www.ithome.com/1/029/609.htm"}},{"title":"李开复：企业 AI 转型只看“智能体数量”是荒谬笑话","summary":"零一万物 CEO、创新工场董事长李开复称，企业 AI 转型只看“智能体数量”是“荒谬的笑话”。他不建议 CEO 把“智能体上线率”“账号数”“节省工时”当作 AI 核心指标，认为这些只是过程指标，管理层最终要看收入、利润和现金流。他建议 CEO 在 AI 汇报会上改问三项竞争优势在智能成本持续下降后是否还成立、会被 AI 增强还是商品化、三年后若不再成立今天应重写哪条业务曲线。","source":{"name":"IT之家·人工智能"},"category":"opinion","score":48,"publishedAt":"2026-11-19T09:53:01.127Z","discoveredAt":"2026-11-19T10:03:22.358Z","selected":false,"links":{"aihot":"https://aihot.news/items/yipvk00qeguv2yqssfkxg6g16","original":"https://www.ithome.com/1/029/582.htm"}},{"title":"Hugging Face 的 Daniel van Strien 实测八款 OCR 模型，百万页数字化成本降至 130 美元以内","summary":"Hugging Face 的 Daniel van Strien 在同一块 Nvidia RTX PRO 6000 上测试八款开源 OCR 模型，使用 850 页古董书、1771 年 Encyclopaedia Britannica 和档案文档。","source":{"name":"The Decoder：AI News（RSS）"},"category":"paper","score":56,"publishedAt":"2026-11-19T09:28:01.000Z","discoveredAt":"2026-11-19T10:00:45.371Z","selected":false,"links":{"aihot":"https://aihot.news/items/i2u2n4g1r8d7yddlflgb1syuo","original":"https://the-decoder.com/ocr-models-now-digitize-a-million-pages-for-under-130-as-costs-drop-fivefold-in-18-months/"}},{"title":"Nvidia 停止向中国出货许可 AI 芯片","summary":"Nvidia 已停止向中国出货其获得许可的 AI 芯片。临时 CEO Colette Kress 表示，在截至 10 月 25 日的季度中，公司向中国出售了价值 24 亿美元的许可 Hopper 代产品，但没有进一步出货的计划。","source":{"name":"X：X.PIN (@thexpin)"},"category":"industry","score":78,"publishedAt":"2026-11-19T09:50:00.000Z","discoveredAt":"2026-11-19T09:57:29.093Z","selected":false,"links":{"aihot":"https://aihot.news/items/ibrfc27kin1uwqi6rk7df825s","original":"https://x.com/thexpin/status/2123353085569380502"}},{"title":"Gartner 预测 2027 年全球 AI 支出将达 4.05 万亿美元，同比增长 47.5%","summary":"Gartner 于本月 12 日发布预测，2027 年全球 AI 支出将达 4.05 万亿美元（约合 27.06 万亿元人民币），同比增长 47.5%。其中 AI 基础设施支出接近 2.4 万亿美元、增长 53%，AI 优化服务器支出 9572 亿美元、同比提升 81%；生成式 AI 模型支出提升 82% 至 510 亿美元，基础模型占其中超八成。","source":{"name":"IT之家·人工智能"},"category":"industry","score":56,"publishedAt":"2026-11-19T09:26:02.553Z","discoveredAt":"2026-11-19T09:42:21.566Z","selected":false,"links":{"aihot":"https://aihot.news/items/j1mvw41iqtlah24lb39gok9k4","original":"https://www.ithome.com/1/029/546.htm"}},{"title":"美国国会委员会建议要求企业披露使用 DeepSeek 等中国 AI 模型并在 SEC 申报中标记为重大风险","summary":"美国国会一个委员会推动国会立法，要求美国公司披露对 DeepSeek、阿里巴巴千问等中国 AI 模型的使用，并在向 SEC 提交的定期申报中将其使用程度标记为重大商业风险。图片中的报告文本还建议联邦机构及受联邦资助的实体披露使用中国实体的 AI 模型，未披露可由 FTC 按不公平欺骗行为执法。原文注明这些措施尚未成为法律要求。","source":{"name":"X：X.PIN (@thexpin)"},"category":"industry","score":64,"publishedAt":"2026-11-19T08:46:46.000Z","discoveredAt":"2026-11-19T08:55:28.977Z","selected":false,"links":{"aihot":"https://aihot.news/items/bc5wolo091nroeny98mwawto5","original":"https://x.com/thexpin/status/2123337174406119817"}},{"title":"微软高管称 Copilot 比 Claude 和 ChatGPT 更好用且更便宜","summary":"微软商业业务 CEO 贾德森·阿尔索夫在 Ignite 大会上称，Claude 或 ChatGPT 能完成的任务，Copilot 都能做得更好且成本更低。截至今年 6 月，Copilot 付费用户已超 3000 万，而微软办公软件企业用户超 4.5 亿。微软委托研究估算，Copilot 用户相关支出显著低于使用 ChatGPT 或 Claude 的用户。","source":{"name":"IT之家·人工智能"},"category":"opinion","score":41,"publishedAt":"2026-11-19T08:19:14.557Z","discoveredAt":"2026-11-19T08:39:22.877Z","selected":false,"links":{"aihot":"https://aihot.news/items/d01xjkb6s22qlmm9lvrip3l9z","original":"https://www.ithome.com/1/029/520.htm"}},{"title":"Perplexity CEO 称 Multiagent 上线一天用量翻倍","summary":"Perplexity CEO Aravind Srinivas 表示 Multiagent 用户反响热烈，一天内使用量翻倍。最受欢迎的场景是可拆成独立并行任务的工作，如组装演示文稿、多来源调研、金融分析和联系人清单。引用的官方介绍称 Multiagent 可用 Fable 5.2 编排 Gemini 4 Carbon、GPT 6.1 Sol、Opus 5.5 并行执行复杂任务，面向 Max 用户开放 web 端，移动端即将支持。","source":{"name":"X：Aravind Srinivas（Perplexity CEO） (@AravSrinivas)"},"category":"ai-products","score":56,"publishedAt":"2026-11-19T08:12:52.000Z","discoveredAt":"2026-11-19T08:34:24.126Z","selected":false,"links":{"aihot":"https://aihot.news/items/tvnrgqjkr2bqqa2axpqpx1a1x","original":"https://x.com/AravSrinivas/status/2123328640549339612"}},{"title":"微软纳德拉：AI 智能体代劳网购将重塑互联网商业格局","summary":"微软 CEO 纳德拉在《纽约时报》DealBook 峰会上表示，能替用户浏览商品并完成购买的 AI 智能体可能重塑互联网商业格局，让依赖用户访问和广告收入的平台重新洗牌。他将这一转变比作互联网入口从雅虎等门户转向谷歌等搜索引擎。纳德拉指出，亚马逊阻止 AI 智能体访问其零售网站，若其他平台选择开放，后者可能获得竞争优势。","source":{"name":"IT之家·人工智能"},"category":"opinion","score":49,"publishedAt":"2026-11-19T07:39:09.947Z","discoveredAt":"2026-11-19T07:57:22.721Z","selected":false,"links":{"aihot":"https://aihot.news/items/kh4cqpsmjihv42um5d0gooo0n","original":"https://www.ithome.com/1/029/497.htm"}},{"title":"Google DeepMind 发布 Gemini 4 Neon，约七周内第四款 Gemini 4 模型","summary":"Google DeepMind 发布 Gemini 4 Neon，为其约七周内的第四款 Gemini 4 模型，定价为每百万 token 输入 $3、缓存输入 $0.15、输出 $15，具备 1M token 上下文窗口和四档 effort 设置。","source":{"name":"Latent Space（RSS）"},"category":"industry","score":76,"publishedAt":"2026-11-19T07:07:43.000Z","discoveredAt":"2026-11-19T07:38:22.105Z","selected":false,"links":{"aihot":"https://aihot.news/items/y31qy9lcxqa6mdi3lmxs2dyz7","original":"https://latent.space/p/ainews-gemini-4-neon-gdm-s-opus-sol-contender/"}},{"title":"像素上海网页游戏小红书玩家超2万，作者更新上海话配音和 8-bit 音乐","summary":"Ring Hyacinth 报告其网页游戏「像素上海」在小红书上已有超过 2 万人玩过，并做了收藏夹收集 repo。此前她与 Claude Opus 5.5 完成一次大更新：配音全部换成上海话、经典老音乐做成 8-bit 版本、字幕添加中英双语并加入更多剧情彩蛋。Demo 可在网页直接玩，20-30 分钟通关，地址 https://ringhyacinth.github.io/hyacinth.im-site/pixel-shanghai/ 。","source":{"name":"X：Ring Hyacinth (@ring_hyacinth)"},"category":"industry","score":60,"publishedAt":"2026-11-19T07:25:25.000Z","discoveredAt":"2026-11-19T07:36:24.831Z","selected":false,"links":{"aihot":"https://aihot.news/items/rknxztl7nic1dmr0bjx3jnubd","original":"https://x.com/ring_hyacinth/status/2123316699541991764"}},{"title":"FT 估算 Anthropic 需约 6020 亿美元年营收才能在约 1 万亿美元算力承诺上获得 20% 回报","summary":"FT Unhedged 通讯估算，Anthropic 需约 6020 亿美元年营收，才能在其约 1 万亿美元算力承诺上获得 20% 回报。该测算按 40% 营业利润率和 17% 税率计算，这一营收目标超过 Alphabet 的 4710 亿美元和 Apple 的 4780 亿美元，约为标普 1500 全部 76 家软件与 IT 服务公司 9080 亿美元总营收的三分之二。","source":{"name":"X：Rohan Paul (@rohanpaul_ai)"},"category":"opinion","score":64,"publishedAt":"2026-11-19T07:12:11.000Z","discoveredAt":"2026-11-19T07:36:24.587Z","selected":false,"links":{"aihot":"https://aihot.news/i rce":{"name":"X：UCSD Hao AI Lab (@haoailab)"},"category":"paper","score":41,"publishedAt":"2026-11-18T19:20:52.000Z","discoveredAt":"2026-11-18T19:40:20.793Z","selected":false,"links":{"aihot":"https://aihot.news/items/tbopyeu391g1ywimr6m693226","original":"https://x.com/haoailab/status/2123134363290452046"}},{"title":"UCSD 提出 RecSA：树形稀疏注意力覆盖全上下文","summary":"UCSD Hao AI Lab 提出 RecSA，用树形结构做稀疏注意力：每个节点 16 个子节点，查询从顶层开始，每层最多打分 4K 候选并选 256 个向下，上下文每扩大 16 倍树才多一层，64K 以内 2 层、2M 时 4 层。","source":{"name":"X：UCSD Hao AI Lab (@haoailab)"},"category":"paper","score":41,"publishedAt":"2026-11-18T19:20:53.000Z","discoveredAt":"2026-11-18T19:40:20.776Z","selected":false,"links":{"aihot":"https://aihot.news/items/ejqfwu18cvme0xqr0hw8lwy0p","original":"https://x.com/haoailab/status/2123134365370921422"}},{"title":"RecSA 稀疏注意力在 RULER 领先","summary":"每个节点的 key 来自一个小型 pooler，每个注意力层约 25K 参数。我们先从冻结的 Qwen3-4B 中逐层蒸馏出该 pooler，然后将其冻结并仅在 32K 序列上训练模型。每种稀疏方法对每个 query 读取相同数量的条目，而 RecSA 在 131K 到 2M 的每个长度上都在 RULER 上排名第一。其领先优势从 131K 时的约 3 分增长到 1M 时的约 20 分，并在 32K 时与稠密注意力持平。","source":{"name":"X：UCSD Hao AI Lab (@haoailab)"},"category":"paper","score":41,"publishedAt":"2026-11-18T19:20:54.000Z","discoveredAt":"2026-11-18T19:40:20.752Z","selected":false,"links":{"aihot":"https://aihot.news/items/xq2st6suh86qoob93dylrbb7p","original":"https://x.com/haoailab/status/2123134368759824631"}},{"title":"RecSA 长上下文注意力推理提速","summary":"在单张 H200、batch size 为 1 的条件下，与同一框架内的稠密 FlashAttention 对比：\n• 524K 长度下 Prefill 耗时 80 秒，稠密注意力为 257 秒。\n• 从 131K 到 524K，Decoding 稳定在每 token 约 6 ms，而稠密注意力从约 9 ms 增长到 23 ms。\n• 在 1M 和 2M 长度下，将相应 token 卸载到主机内存后，RecSA 的 Decoding 分别为每 token 8 ms 和 11 ms；稠密注意力则需 177 ms 和 2.9 秒。\n我们用 Triton 和 CUDA 编写这些 kernel，并且 e","source":{"name":"X：UCSD Hao AI Lab (@haoailab)"},"category":"paper","score":42,"publishedAt":"2026-11-18T19:20:54.000Z","discoveredAt":"2026-11-18T19:40:20.714Z","selected":false,"links":{"aihot":"https://aihot.news/items/qyrjisc053hvkodlxlphbucuo","original":"https://x.com/haoailab/status/2123134370785714495"}},{"title":"为什么你的微调任务比 FLOPs 估算耗时更久：基于 272 次生产运行的端到端时长预测","summary":"研究基于 272 次真实 SFT 任务（约 7,382 GPU-hours，NVIDIA H200）对比 FLOPs 解析估算与学习型预测器。传统 FLOP 估算仅得 R²=0.31、MAE 12.41 h，而仅用调度前信息的 CatBoost 回归器在 5 折交叉验证下达到 R²=0.98、MAE 1.71 h、中位误差 0.51 h。","source":{"name":"Hugging Face 社区博客（混合发现）"},"category":"paper","score":46,"publishedAt":"2026-11-18T18:53:43.000Z","discoveredAt":"2026-11-18T19:28:15.171Z","selected":false,"links":{"aihot":"https://aihot.news/items/e9405qzuolrgf92k4v8ddbmb1","original":"https://huggingface.co/blog/Dharma-AI/predicting-fine-tuning-time"}},{"title":"Claude 推出 Meetings、Whiteboards、Sheets、Data 等五种办公用法","summary":"Claude 官方介绍五种新的办公用法：Claude Meetings 可加入会议并记笔记，语音让它在 Claude Whiteboards 开板，会后可在 Claude Sheets 生成表格或在 Claude Data 生成仪表盘，interactive connectors 让用户不离开 Claude 直接使用现有应用。","source":{"name":"Claude：YouTube（RSS）"},"category":"ai-products","score":66,"publishedAt":"2026-11-18T18:39:05.000Z","discoveredAt":"2026-11-18T19:25:14.762Z","selected":false,"links":{"aihot":"https://aihot.news/items/qbuqogfihuly4lma9f4rj7lo4","original":"https://www.youtube.com/watch?v=t2Zo3YAJdj4"}},{"title":"黄仁勋辞职后首次财报电话会：Nvidia 新 CEO Colette Kress 收紧支出并回应回归呼声","summary":"作者分析黄仁勋辞职后 Nvidia 首次由新 CEO Colette Kress 主持的财报电话会，指出董事会明确不打算让黄仁勋回归，也不会回答相关问题。财报释放的新条款显示 neocloud 只有在拿到融资且数据中心建成投产后才能获得 Nvidia 的采购兜底，作者认为这透露了 Nvidia 支持意愿的边界。","source":{"name":"The Verge：AI（RSS）"},"category":"industry","score":83,"publishedAt":"2026-11-18T18:34:15.000Z","discoveredAt":"2026-11-18T19:25:14.707Z","selected":true,"links":{"aihot":"https://aihot.news/items/gpvt9y9d89gd5nkw92bwhyw6s","original":"https://www.theverge.com/ai-artificial-intelligence/1036776/nvidia-earnings-kress-jensen-huang-petition"}},{"title":"美国国会参议院听证推进结束强制仲裁与 Defiance Act 深伪造受害者诉讼权立法","summary":"美国参议院司法小组委员会举行听证，参议员 Hawley 与 Durbin 提出法案，拟让涉及儿童性剥削或\"儿童网络伤害\"争议中的强制仲裁协议不可执行，直接针对 Roblox 在约 180 起合并诉讼中对未成年时同意条款用户执行仲裁条款的做法。","source":{"name":"The Verge：AI（RSS）"},"category":"industry","score":52,"publis function loadLearn(){
  try{
    const o=JSON.parse(localStorage.getItem(LEARN_KEY));
    if(o&&o.clicks&&o.impr) return {on:o.on!==false,impr:o.impr,clicks:o.clicks};

function bump(o,k,n){o[k]=(o[k]||0)+n;}
function catKey(it){return it.category||"other";}
function tagKeys(it){const a=[];if(it._dom)a.push("dom");if(it._pol)a.push("pol");if(it._eco)a.push("eco");if(it._grp)a.push("theory");return a;}
function aff(kind,key){const c=(LEARN.clicks[kind]||{})[key]||0;const i=(LEARN.impr[kind]||{})[key]||0;return (c+0.5)/(i+5);}
function learnBoost(it){
  if(!LEARN.on) return 0;
  const catAff=aff("cat",catKey(it));
  const tags=tagKeys(it);
  const tagAff=tags.length?tags.reduce((s,t)=>s+aff("tag",t),0)/tags.length:0;
  return Math.round(LEARN_MAX*(0.6*catAff+0.4*tagAff));
}

const SAVED_KEY="ai_news_saved_v1";
let SAVED=new Set(loadSaved());
function loadSaved(){try{const a=JSON.parse(localStorage.getItem(SAVED_KEY));return Array.isArray(a)?a:[];}catch(e){return[];}}
function saveSaved(){try{localStorage.setItem(SAVED_KEY,JSON.stringify([...SAVED]));}catch(e){}}
function isBlockedUrl(u){try{const host=new URL(u).hostname.replace(/^www\./,"");return BLOCKED_HOST.test(host);}catch(e){return false;}}

function escapeHtml(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function truncate(s,n){s=(s||"").trim();return s.length<=n?s:s.slice(0,n-1)+"…";}
function norm(s){return (s||"").toLowerCase().replace(/[^\w\u4e00-\u9fff]+/g,"");}
function hasKw(t,k){
  if(/[a-z0-9]/.test(k)){
    const escK=k.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
    return new RegExp("(?<![a-z0-9])"+escK+"(?![a-z0-9])","i").test(t);
  }
  return t.includes(k);
}
function bjParts(iso){
  const d=new Date(iso); if(!iso||isNaN(d)) return null;
  const b=new Date(d.getTime()+8*3600*1000);
  return {y:b.getUTCFullYear(),m:b.getUTCMonth()+1,d:b.getUTCDate(),hh:String(b.getUTCHours()).padStart(2,"0"),mm:String(b.getUTCMinutes()).padStart(2,"0")};
}
function bjNow(){const b=new Date(Date.now()+8*3600*1000);return {y:b.getUTCFullYear(),m:b.getUTCMonth()+1,d:b.getUTCDate()};}
function timeLabel(it){
  const p=bjParts(it.publishedAt||it.discoveredAt); if(!p) return "";
  const n=bjNow();
  if(p.y===n.y&&p.m===n.m&&p.d===n.d) return "今天 "+p.hh+":"+p.mm;
  const yb=new Date(Date.now()+8*3600*1000-86400000);
  if(p.y===yb.getUTCFullYear()&&p.m===yb.getUTCMonth()+1&&p.d===yb.getUTCDate()) return "昨天 "+p.hh+":"+p.mm;
  return p.m+" 月 "+p.d+" 日 "+p.hh+":"+p.mm;
}
function bigrams(s){
  const t=norm(s), set=new Set();
  for(let i=0;i<t.length-1;i++) set.add(t.slice(i,i+2));
  return set;
}
function sim(a,b){
  const A=bigrams(a),B=bigrams(b);
  if(!A.size||!B.size) return 0;
  let n=0; for(const x of A) if(B.has(x)) n++;
  return n/Math.min(A.size,B.size); // 重叠系数：对中文改写/长短不一更稳
}
function hasSharedName(a,b){
  const re=/[A-Za-z][A-Za-z0-9.\-]{3,}/g;
  const A=new Set((a.match(re)||[]).map(x=>x.toLowerCase()));
  const B=new Set((b.match(re)||[]).map(x=>x.toLowerCase()));
  const stop=new Set(["openai","google","anthropic","microsoft","deepmind","model","models","release","update","launch","agent","agents","artificial","analysis","research","report"]);
  return [...A].some(x=>B.has(x)&&!stop.has(x));
}
function vkeys(t){return new Set((t.match(/[A-Za-z][A-Za-z0-9.\-]{1,}\s?\d+(?:\.\d+)?/g)||[]).map(x=>x.toLowerCase().replace(/\s/g,"")));}

function enrich(it){
  const text=((it.title||"")+" "+(it.summary||"")).toLowerCase();
  const dom=DOM_CONTENT_RE.test((it.title||"")+" "+(it.summary||""));
  const pol=POLICY.some(k=>hasKw(text,k));
  const eco=ECO.some(k=>hasKw(text,k));
  const P=PROFILES[state.profile];
  let grp=null;
  // 论文直接计入「前沿理论」，不依赖标题关键词
  if(P.groups.indexOf("theory")>=0 && it.category==="paper") grp="theory";
  if(!grp){ for(const g of P.groups){ if(DOMAINS[g].some(k=>hasKw(text,k))){grp=g;break;} } }
  const sc=it.score||0, w=P.w;
  const raw=w.base*(sc/100)+(grp?w.domain:0)+(pol?w.policy:0)+(dom?w.domestic:0)+(eco?w.eco:0);
  const rel0=Math.round(Math.max(0,Math.min(1,raw))*100);
  let insp=P.insp[grp];
  if(!insp) insp=pol?"政策 / 协议信号，可能影响选题方向与合规边界。":(eco?"开源 / 生态动向，影响后续工具链选型。":"可作为选题或技术选型的背景参考。");
  const out=Object.assign({},it,{_dom:dom,_pol:pol,_eco:eco,_grp:grp,_rel:rel0,_time:timeLabel(it),_insp:insp});
  out._rel=Math.min(100, rel0 + learnBoost(out));
  return out;
}

function dedupe(items){
  const sorted=items.slice().sort((a,b)=>b._rel-a._rel||(b.score||0)-(a.score||0));
  const kept=[];
  for(const it of sorted){
    const t=norm(it.title), vk=vkeys(it.title||"");
    let dup=false;
    for(const k of kept){
      const o=sim(t,norm(k.title));
      if(t===norm(k.title)){dup=true;break;}
      if(o>0.72){dup=true;break;}
      if(o>0.55&&hasSharedName(it.title||"",k.title||"")){dup=true;break;}
      if(it.category===k.category&&vk.size&&[...vk].some(x=>vkeys(k.title||"").has(x))){dup=true;break;}
    }
    if(!dup) kept.push(it);
  }
  return kept;
}
function capEvent(items,limit){
  const cnt={},out=[];
  for(const it of items){
    const ks=vkeys(it.title||""), key=ks.size?[...ks].sort()[0]:null;
    if(key===null){out.push(it);continue;}
    if((cnt[key]||0)<limit){cnt[key]=(cnt[key]||0)+1;out.push(it);}
  }
  return out;
}

function fetchPage(window_,cursor){
  let url=API+"/items?mode=all&window="+window_+"&limit=100";
  if(cursor) url+="&cursor="+encodeURIComponent(cursor);
  return fetch(url).then(r=>{if(!r.ok) throw new Error("HTTP "+r.status);return r.json();});
}
async function loadData(){
  setLoading();
  if(location.search.includes("snapshot=1")){
    state.items=(FALLBACK&&FALLBACK.items)||[]; state.live=false; state.ts=(FALLBACK&&FALLBACK.ts)||"";
    renderAll(); return;
  }
  try{
    let all=[], cursor=null;
    for(let p=0;p<2;p++){
      const d=await fetchPage("24h",cursor);
      all=all.concat(d.items||[]);
      const pg=d.page||{};
      if(!pg.hasMore||!pg.nextCursor) break;
      cursor=pg.nextCursor;
    }
    if(!all.length) throw new Error("empty");
    state.items=all; state.live=true; state.loadedAt=new Date(); state.ts="";
    renderAll();
  }catch(e){
    state.live=false;
    state.items=(FALLBACK&&FALLBACK.items)||[];
    state.ts=(FALLBACK&&FALLBACK.ts)||"";
    renderAll();
    const b=document.getElementById("banner");
    b.hidden=false;
    b.textContent="实时接口暂不可用，当前展示内置快照"+(state.ts?"（生成于 "+state.ts+"）":"")+"。可点右上角「刷新数据」重试。";
  }
}

function tagHTML(it){
  let t='<span class="tag '+(it._dom?"dom":"ovs")+'">'+(it._dom?"国内":"海外")+"</span>";
  if(it._pol) t+='<span class="tag pol">政策/协议</span>';
  if(it._eco) t+='<span class="tag eco">开源/生态</span>';
  if(it._grp) t+='<span class="tag rel">★ 画像相关</span>';
  if(it.selected===false) t+='<span class="tag muted">未入精选</span>';
  if(typeof SAVED!=="undefined" && SAVED.has(it.title)) t+='<span class="tag muted">稍后读</span>';
  t+='<span class="tag score">相关 '+it._rel+"</span>";
  return t;
}
// 国内打不开的源（X / YouTube / Telegram 等）改用 AIHOT 站内页
const BLOCKED_HOST = /(^|\.)(x\.com|twitter\.com|youtube\.com|youtu\.be|t\.me|telegram\.org|facebook\.com|instagram\.com|reddit\.com|discord\.com|threads\.net|linkedin\.com)$/i;
function pickHref(it){
  const l=it.links||{}, orig=l.original||"";
  try{
    const host=new URL(orig).hostname.replace(/^www\./,"");
    if(BLOCKED_HOST.test(host) && l.aihot) return l.aihot;
  }catch(e){}
  return orig || l.aihot || "#";
}
function secColor(it){const i=(it.category in CAT2SEC)?CAT2SEC[it.category]:4;return SECTIONS[i][1];}
function cardHTML(idx,it){
  return '<article class="card" id="c'+idx+'" data-idx="'+idx+'" data-title="'+escapeHtml(it.title||"")+'" data-dom="'+(it._dom?1:0)+'" data-pol="'+(it._pol?1:0)+'" data-rel="'+(it._grp?1:0)+'" data-cat="'+escapeHtml(it.category||"other")+'" data-tags="'+tagKeys(it).join(",")+'" tabindex="0" role="button" style="--c:'+secColor(it)+'">'
    +'<div class="card-top"><span class="num">'+idx+'</span><span class="src-chip">'+escapeHtml((it.source&&it.source.name)||"")+'</span></div>'
    +'<div class="card-meta"><span class="time">'+escapeHtml(it._time)+"</span>"+tagHTML(it)+"</div>"
    +'<h3 class="card-title">'+escapeHtml(it.title||"")+"</h3>"
    +'<p class="card-sum">'+escapeHtml(truncate(it.summary||"",60))+"</p>"
    +'<span class="card-link">查看详情 &rarr;</span></article>';
}
function radarHTML(rows){
  return rows.map((it,n)=>{
    const href = it._idx ? ("#c"+it._idx) : pickHref(it);
    return '<div class="radar-row" data-dom="'+(it._dom?1:0)+'" data-pol="'+(it._pol?1:0)+'" data-rel="'+(it._grp?1:0)+'">'
      +'<div class="r-rank">'+String(n+1).padStart(2,"0")+"</div>"
      +'<div class="r-body"><a class="r-title" href="'+href+'" title="跳到下方第 '+it._idx+' 条">'+escapeHtml(it.title||"")+"</a>"
      +'<div class="r-meta">'+escapeHtml((it.source&&it.source.name)||"")+" · "+escapeHtml(it._time)+" · 相关 "+it._rel+"</div>"
      +'<div class="r-insp">可借鉴：'+escapeHtml(it._insp)+"</div></div></div>";
  }).join("");
}

function relScore(a,b){
  let s=0;
  if(a.category===b.category) s+=1;
  if(a._grp&&a._grp===b._grp) s+=2;
  if(a._dom&&b._dom) s+=1;
  if(a._pol&&b._pol) s+=1;
  return s;
}

    .sort(function(a,b){return relScore(it,b)-relScore(it,a);}).slice(0,4);

    +'<h2 class="d-title">'+escapeHtml(it.title||"")+'</h2>'
    +'<div class="d-meta">'+escapeHtml((it.source&&it.source.name)||"")+' · '+escapeHtml(it._time)+' · 相关 '+it._rel+'</div>'
    +'<p class="d-sum">'+escapeHtml(it.summary||"")+'</p>'

    +'<div class="d-actions">'
      +(origOk?'<a class="d-btn primary" href="'+escapeHtml(orig)+'" target="_blank" rel="noopener noreferrer">阅读原文</a>':"")
      +(aihot?'<a class="d-btn" href="'+escapeHtml(aihot)+'" target="_blank" rel="noopener noreferrer">在 AIHOT 查看</a>':"")

  const d=document.getElementById("drawer");

    renderAll(); showToast(SAVED.has(it.title)?"已加入稍后读":"已移出稍后读");
  };
  document.querySelectorAll(".d-rel-item").forEach(function(a){
    a.onclick=function(e){
      e.preventDefault(); closeDrawer();

function closeDrawer(){
  const d=document.getElementById("drawer"); if(!d||d.hidden) return;
  d.classList.remove("open");
  setTimeout(function(){d.hidden=true;},220);
  document.body.style.overflow="";
}
function latestMs(){
  let max=0;
  for(const it of (state.items||[])){
    const t=Date.parse(it.publishedAt||it.discoveredAt||"");
    if(t>max) max=t;
  }
  return max;
}
function ageLabel(h){
  if(!isFinite(h)) return "未知";
  if(h<1) return Math.max(1,Math.round(h*60))+" 分钟前";
  if(h<24) return (Math.round(h*10)/10)+" 小时前";
  return Math.round(h/24)+" 天前";
}
function renderAll(){
  const P=PROFILES[state.profile], now=bjNow();
  // 标题用「数据时间」而非浏览器当前时间，避免标题新、内容旧的错觉
  const lt=latestMs(), lp=lt?bjParts(new Date(lt).toISOString()):null;
  const ageH=lt?(Date.now()-lt)/3600000:Infinity;
  const stale=(!isFinite(ageH))||ageH>3;
  const h1=document.getElementById("dateTitle");
  if(lp){
    h1.textContent=lp.y+" 年 "+lp.m+" 月 "+lp.d+" 日 "+WEEK[new Date(Date.UTC(lp.y,lp.m-1,lp.d)).getUTCDay()];
  }else{
    h1.textContent=now.y+" 年 "+now.m+" 月 "+now.d+" 日 "+WEEK[new Date(Date.UTC(now.y,now.m-1,now.d)).getUTCDay()];
  }
  h1.classList.toggle("stale", stale);
  const sub=document.getElementById("subTitle");
  if(sub) sub.textContent = lp
    ? "数据更新于 "+lp.m+" 月 "+lp.d+" 日 "+lp.hh+":"+lp.mm+"（"+ageLabel(ageH)+"）· 共 "+state.items.length+" 条原始条目"
    : "连接 AI HOT 公开接口";
  const badge=document.getElementById("liveBadge");
  badge.textContent=state.live?"实时拉取":"内置快照";
  badge.className="live"+(state.live?"":" off");
  document.getElementById("profileNote").textContent="当前画像："+P.label+" · 权重 领域相关性 "+Math.round(P.w.domain*100)+"% / 热度 "+Math.round(P.w.base*100)+"% / 政策 "+Math.round(P.w.policy*100)+"% / 国内 "+Math.round(P.w.domestic*100)+"%";
  const bnr=document.getElementById("banner");
  if(!state.live && stale && lp){
    bnr.hidden=false;
    bnr.textContent="内置快照已 "+ageLabel(ageH)+"未更新（数据截至 "+lp.m+" 月 "+lp.d+" 日 "+lp.hh+":"+lp.mm+"），内容不代表当前。点右上角「刷新数据」重试。";
  }else if(state.live){
    bnr.hidden=true;
  }

  // 画像按钮
  document.getElementById("profiles").innerHTML=Object.keys(PROFILES).map(k=>'<button data-p="'+k+'" class="'+(k===state.profile?"on":"")+'">'+PROFILES[k].label+"</button>").join("");
  document.querySelectorAll(".filters button[data-f]").forEach(b=>b.classList.toggle("on", b.dataset.f===state.filter));

  const enriched=dedupe(state.items.map(enrich));
  const pool=capEvent(enriched,2);
  const secs=SECTIONS.map(()=>[]);
  for(const it of pool){
    const idx=(it.category in CAT2SEC)?CAT2SEC[it.category]:4;
    secs[idx].push(it);
  }
  secs.forEach(a=>a.sort((x,y)=>y._rel-x._rel));
  const cap=7;
  const shown=secs.map(a=>a.slice(0,cap));

  let gi=0;
  shown.forEach(a=>a.forEach(it=>{gi++;it._idx=gi;}));
  const flat=shown.flat();
  // 曝光计数：同一会话同一标题只记一次
  flat.forEach(function(it){
    if(SESSION_SEEN.has(it.title)) return;
    SESSION_SEEN.add(it.title);
    bump(LEARN.impr.cat,catKey(it),1);
    tagKeys(it).forEach(function(t){bump(LEARN.impr.tag,t,1);});
  });
  saveLearn();
  state.view=flat; state.byIdx={};
  flat.forEach(function(it){state.byIdx[it._idx]=it;});
  const domN=flat.filter(x=>x._dom).length, polN=flat.filter(x=>x._pol).length, relN=flat.filter(x=>x._grp).length;
  document.getElementById("subTitle").textContent="过去 24 小时 · 共 "+flat.length+" 条（已去重）· 国内 "+domN+" 条";
  document.getElementById("stats").innerHTML=
    '<div class="stat">总条数<b>'+flat.length+'</b></div>'+
    '<div class="stat">国内<b>'+domN+'</b></div>'+
    '<div class="stat">政策/协议<b>'+polN+'</b></div>'+
    '<div class="stat">★ 画像相关<b>'+relN+'</b></div>'+
    SECTIONS.map((s,i)=>'<div class="stat sec-stat">'+s[0].replace("发布/更新","")+'<b>'+shown[i].length+'</b></div>').join("");

  // 导航（窄屏用短标签，避免顶到右边缘）
  const narrow=window.matchMedia("(max-width:520px)").matches;
  const shortName=n=>n.replace("发布/更新","").replace("动态","").replace("研究","").replace("与观点","");
  let nav='<a class="nav-pill" href="#radar" style="--c:#7c3aed">'+(narrow?"雷达":"灵感雷达")+'<b>5</b></a>';
  SECTIONS.forEach((s,i)=>{
    const lb=narrow?shortName(s[0]):s[0];
    nav+='<a class="nav-pill" href="#sec-'+i+'" style="--c:'+s[1]+'">'+lb+'<b>'+shown[i].length+"</b></a>";
  });
  document.getElementById("anchors").innerHTML=nav;

  // 雷达
  const radar=flat.slice().sort((a,b)=>(b._rel+(P.bonus[b._grp]||0))-(a._rel+(P.bonus[a._grp]||0))).slice(0,5);
  document.getElementById("radarList").innerHTML=radar.length?radarHTML(radar):'<div class="empty">暂无可用条目</div>';
  document.getElementById("radarDesc").textContent="从本期 "+flat.length+" 条中挑出与「"+P.label+"」最相关、最可能触发灵感的 "+radar.length+" 条，附规则化「可借鉴」提示。";

  // 版块
  document.getElementById("sections").innerHTML=SECTIONS.map((s,i)=>{
    const body=shown[i].length?shown[i].map(it=>cardHTML(it._idx,it)).join(""):'<div class="empty">本期暂无该版块条目</div>';
    return '<section id="sec-'+i+'" class="section"><h2 class="sec-head" style="--c:'+s[1]+'"><span class="dot" style="background:'+s[1]+'"></span>'+s[0]+'<span class="sec-count">'+shown[i].length+'</span></h2><div class="grid">'+body+"</div></section>";
  }).join("");

  if(location.search.includes("debug=1")){
    const b=document.getElementById("banner"); b.hidden=false;
    b.textContent="DEBUG dim="+document.documentElement.scrollWidth+"x"+document.documentElement.clientWidth+" "+JSON.stringify(flat.filter(x=>x._grp).map(x=>[x._grp,(x.title||"").slice(0,20)]));
  }
  renderLearnLine();
  applyFilter();
  bindProfile();
}

function applyFilter(){
  const f=state.filter;
  document.querySelectorAll(".card,.radar-row").forEach(c=>{
    let ok=true;
    if(f==="dom") ok=c.dataset.dom==="1";
    if(f==="pol") ok=c.dataset.pol==="1";
    if(f==="rel") ok=c.dataset.rel==="1";
    if(f==="saved") ok=SAVED.has(c.dataset.title);
    c.style.display=ok?"":"none";
  });
  document.querySelectorAll(".section").forEach(s=>{
    const any=[...s.querySelectorAll(".card")].some(c=>c.style.display!=="none");
    s.style.display=any?"":"none";
  });
  const rd=document.querySelector(".radar");
  if(rd){
    const any=[...rd.querySelectorAll(".radar-row")].some(c=>c.style.display!=="none");
    rd.style.display=any?"":"none";
  }
}
function bindProfile(){
  document.querySelectorAll("#profiles button").forEach(b=>{
    b.onclick=()=>{state.profile=b.dataset.p;renderAll();};
  });
}

document.querySelectorAll(".filters button[data-f]").forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll(".filters button[data-f]").forEach(x=>x.classList.remove("on"));
    b.classList.add("on");
    state.filter=b.dataset.f;
    applyFilter();
  };
});
document.getElementById("refreshBtn").onclick=loadData;
window.addEventListener("resize",function(){clearTimeout(window.__rz);window.__rz=setTimeout(renderAll,150);});

// 点击卡片：记录类别 / 标签点击，作为后续排序的轻量信号
document.addEventListener("click",function(e){
  const a=e.target.closest(".card");
  if(!a) return;
  const cat=a.dataset.cat||"other";
  const tags=(a.dataset.tags||"").split(",").filter(Boolean);
  bump(LEARN.clicks.cat,cat,1);
  tags.forEach(function(t){bump(LEARN.clicks.tag,t,1);});
  saveLearn(); renderLearnLine();
  openDrawer(a.dataset.idx);
});
document.addEventListener("keydown",function(e){
  if(e.key==="Escape"){closeDrawer();return;}
  if((e.key==="Enter"||e.key===" ")&&e.target.classList&&e.target.classList.contains("card")){
    e.preventDefault(); e.target.click();
  }
});

loadData();
</script>
