function loadLearn(){
  try{
    const o=JSON.parse(localStorage.getItem(LEARN_KEY));
    if(o&&o.clicks&&o.impr) return {on:o.on!==false,impr:o.impr,clicks:o.clicks};
  }catch(e){}
  return {on:true,impr:{cat:{},tag:{}},clicks:{cat:{},tag:{}}};
}
function saveLearn(){try{localStorage.setItem(LEARN_KEY,JSON.stringify(LEARN));}catch(e){}}
function bump(o,k,n){o[k]=(o[k]||0)+n;}
function catKey(it){return it.category||"other";}
function tagKeys(it){const a=[];if(it._dom)a.push("dom");if(it._pol)a.push("pol");if(it._eco)a.push("eco");if(it._grp)a.push("theory");return a;}
function aff(kind,key){const c=(LEARN.clicks[kind]||{})[key]||0;const i=(LEARN.impr[kind]||{})[key]||0;return (c+0.5)/(i+5);}
function learnBoost(it){
  if(!LEARN.on) return 0;
  const catAff=aff("cat",catKey(it));
  const tags=tagKeys(it);
  const tagAff=tags.length?tags.reduce((s,t)=>s+aff("tag",t),0)/tags.length:0;
  return Math.round(LEARN_MAX*(0.6*catAff+0.4*tagAff));
}
let toastTimer;
function showToast(msg){
  const t=document.getElementById("toast"); if(!t) return;
  t.textContent=msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer=setTimeout(function(){t.classList.remove("show");},1700);
}
function renderLearnLine(){
  const line=document.getElementById("learnLine"); if(!line) return;
  const total=Object.keys(LEARN.clicks.cat||{}).reduce(function(s,k){return s+(LEARN.clicks.cat[k]||0);},0);
  let text;
  if(!total){
    text="点击学习：点开任意卡片，会按类别微调后续排序（仅存本地，不上传）";
  }else{
    const top=Object.entries(LEARN.clicks.cat).sort(function(a,b){return b[1]-a[1];}).slice(0,3)
      .map(function(e){return (CAT_LABEL[e[0]]||e[0])+" "+e[1];}).join(" · ");
    text="点击学习：已记录 "+total+" 次 · "+top+"（下次刷新生效）";
  }
  line.innerHTML='<span>'+text+'</span>'
    +'<button id="learnToggle">'+(LEARN.on?"关闭学习":"开启学习")+'</button>'
    +'<button id="learnReset">重置</button>';
  document.getElementById("learnToggle").onclick=function(){

}

  const d=new Date(iso); if(!iso||isNaN(d)) return null;
  const b=new Date(d.getTime()+8*3600*1000);
  return {y:b.getUTCFullYear(),m:b.getUTCMonth()+1,d:b.getUTCDate(),hh:String(b.getUTCHours()).padStart(2,"0"),mm:String(b.getUTCMinutes()).padStart(2,"0")};
}
function bjNow(){const b=new Date(Date.now()+8*3600*1000);return {y:b.getUTCFullYear(),m:b.getUTCMonth()+1,d:b.getUTCDate()};}
function timeLabel(it){
  const p=bjParts(it.publishedAt||it.discoveredAt); if(!p) return "";
  const n=bjNow();
  if(p.y===n.y&&p.m===n.m&&p.d===n.d) return "今天 "+p.hh+":"+p.mm;
  const yb=new Date(Date.now()+8*3600*1000-86400000);
  if(p.y===yb.getUTCFullYear()&&p.m===yb.getUTCMonth()+1&&p.d===yb.getUTCDate()) return "昨天 "+p.hh+":"+p.mm;
  return p.m+" 月 "+p.d+" 日 "+p.hh+":"+p.mm;
}
function bigrams(s){
  const t=norm(s), set=new Set();
  for(let i=0;i<t.length-1;i++) set.add(t.slice(i,i+2));
  return set;
}
function sim(a,b){
  const A=bigrams(a),B=bigrams(b);
  if(!A.size||!B.size) return 0;
  let n=0; for(const x of A) if(B.has(x)) n++;
  return n/Math.min(A.size,B.size); // 重叠系数：对中文改写/长短不一更稳
}
function hasSharedName(a,b){
  const re=/[A-Za-z][A-Za-z0-9.\-]{3,}/g;
  const A=new Set((a.match(re)||[]).map(x=>x.toLowerCase()));
  const B=new Set((b.match(re)||[]).map(x=>x.toLowerCase()));
  const stop=new Set(["openai","google","anthropic","microsoft","deepmind","model","models","release","update","launch","agent","agents","artificial","analysis","research","report"]);
  return [...A].some(x=>B.has(x)&&!stop.has(x));
}
function vkeys(t){return new Set((t.match(/[A-Za-z][A-Za-z0-9.\-]{1,}\s?\d+(?:\.\d+)?/g)||[]).map(x=>x.toLowerCase().replace(/\s/g,"")));}

function enrich(it){
  const text=((it.title||"")+" "+(it.summary||"")).toLowerCase();
  const dom=DOM_CONTENT_RE.test((it.title||"")+" "+(it.summary||""));
  const pol=POLICY.some(k=>hasKw(text,k));
  const eco=ECO.some(k=>hasKw(text,k));
  const P=PROFILES[state.profile];
  let grp=null;
  // 论文直接计入「前沿理论」，不依赖标题关键词
  if(P.groups.indexOf("theory")>=0 && it.category==="paper") grp="theory";
  if(!grp){ for(const g of P.groups){ if(DOMAINS[g].some(k=>hasKw(text,k))){grp=g;break;} } }
  const sc=it.score||0, w=P.w;
  const raw=w.base*(sc/100)+(grp?w.domain:0)+(pol?w.policy:0)+(dom?w.domestic:0)+(eco?w.eco:0);
  const rel0=Math.round(Math.max(0,Math.min(1,raw))*100);
  let insp=P.insp[grp];
  if(!insp) insp=pol?"政策 / 协议信号，可能影响选题方向与合规边界。":(eco?"开源 / 生态动向，影响后续工具链选型。":"可作为选题或技术选型的背景参考。");
  const out=Object.assign({},it,{_dom:dom,_pol:pol,_eco:eco,_grp:grp,_rel:rel0,_time:timeLabel(it),_insp:insp});
  out._rel=Math.min(100, rel0 + learnBoost(out));
  return out;
}

function dedupe(items){
  const sorted=items.slice().sort((a,b)=>b._rel-a._rel||(b.score||0)-(a.score||0));
  const kept=[];
  for(const it of sorted){
    const t=norm(it.title), vk=vkeys(it.title||"");
    let dup=false;
    for(const k of kept){
      const o=sim(t,norm(k.title));
      if(t===norm(k.title)){dup=true;break;}
      if(o>0.72){dup=true;break;}
      if(o>0.55&&hasSharedName(it.title||"",k.title||"")){dup=true;break;}
      if(it.category===k.category&&vk.size&&[...vk].some(x=>vkeys(k.title||"").has(x))){dup=true;break;}
    }
    if(!dup) kept.push(it);
  }
  return kept;
}
function capEvent(items,limit){
  const cnt={},out=[];
  for(const it of items){
    const ks=vkeys(it.title||""), key=ks.size?[...ks].sort()[0]:null;
    if(key===null){out.push(it);continue;}
    if((cnt[key]||0)<limit){cnt[key]=(cnt[key]||0)+1;out.push(it);}
  }
  return out;
}

function fetchPage(window_,cursor){
  let url=API+"/items?mode=all&window="+window_+"&limit=100";
  if(cursor) url+="&cursor="+encodeURIComponent(cursor);
  return fetch(url).then(r=>{if(!r.ok) throw new Error("HTTP "+r.status);return r.json();});
}
async function loadData(){
  setLoading();
  if(location.search.includes("snapshot=1")){
    state.items=(FALLBACK&&FALLBACK.items)||[]; state.live=false; state.ts=(FALLBACK&&FALLBACK.ts)||"";
    renderAll(); return;
  }
  try{
    let all=[], cursor=null;
    for(let p=0;p<2;p++){
      const d=await fetchPage("24h",cursor);
      all=all.concat(d.items||[]);
      const pg=d.page||{};
      if(!pg.hasMore||!pg.nextCursor) break;
      cursor=pg.nextCursor;
    }
    if(!all.length) throw new Error("empty");
    state.items=all; state.live=true; state.loadedAt=new Date(); state.ts="";
    renderAll();
  }catch(e){
    state.live=false;
    state.items=(FALLBACK&&FALLBACK.items)||[];
    state.ts=(FALLBACK&&FALLBACK.ts)||"";
    renderAll();
    const b=document.getElementById("banner");
    b.hidden=false;
    b.textContent="实时接口暂不可用，当前展示内置快照"+(state.ts?"（生成于 "+state.ts+"）":"")+"。可点右上角「刷新数据」重试。";
  }
}

function setLoading(){
  document.getElementById("dateTitle").textContent="正在拉取今日资讯…";
  document.getElementById("subTitle").textContent="连接 AI HOT 公开接口";
  document.getElementById("stats").innerHTML="";
  document.getElementById("radarList").innerHTML='<div class="radar-row"><div class="r-body"><div class="skeleton"></div></div></div>';
  document.getElementById("sections").innerHTML='<div class="section"><div class="grid"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div></div>';
  document.getElementById("anchors").innerHTML="";
}

function tagHTML(it){
  let t='<span class="tag '+(it._dom?"dom":"ovs")+'">'+(it._dom?"国内":"海外")+"</span>";
  if(it._pol) t+='<span class="tag pol">政策/协议</span>';
  if(it._eco) t+='<span class="tag eco">开源/生态</span>';
  if(it._grp) t+='<span class="tag rel">★ 画像相关</span>';
  if(it.selected===false) t+='<span class="tag muted">未入精选</span>';
  if(typeof SAVED!=="undefined" && SAVED.has(it.title)) t+='<span class="tag muted">稍后读</span>';
  t+='<span class="tag score">相关 '+it._rel+"</span>";
  return t;
}
// 国内打不开的源（X / YouTube / Telegram 等）改用 AIHOT 站内页
const BLOCKED_HOST = /(^|\.)(x\.com|twitter\.com|youtube\.com|youtu\.be|t\.me|telegram\.org|facebook\.com|instagram\.com|reddit\.com|discord\.com|threads\.net|linkedin\.com)$/i;
function pickHref(it){
  const l=it.links||{}, orig=l.original||"";
  try{
    const host=new URL(orig).hostname.replace(/^www\./,"");
    if(BLOCKED_HOST.test(host) && l.aihot) return l.aihot;
  }catch(e){}
  return orig || l.aihot || "#";
}
function secColor(it){const i=(it.category in CAT2SEC)?CAT2SEC[it.category]:4;return SECTIONS[i][1];}
function cardHTML(idx,it){
  return '<article class="card" id="c'+idx+'" data-idx="'+idx+'" data-title="'+escapeHtml(it.title||"")+'" data-dom="'+(it._dom?1:0)+'" data-pol="'+(it._pol?1:0)+'" data-rel="'+(it._grp?1:0)+'" data-cat="'+escapeHtml(it.category||"other")+'" data-tags="'+tagKeys(it).join(",")+'" tabindex="0" role="button" style="--c:'+secColor(it)+'">'
    +'<div class="card-top"><span class="num">'+idx+'</span><span class="src-chip">'+escapeHtml((it.source&&it.source.name)||"")+'</span></div>'
    +'<div class="card-meta"><span class="time">'+escapeHtml(it._time)+"</span>"+tagHTML(it)+"</div>"
    +'<h3 class="card-title">'+escapeHtml(it.title||"")+"</h3>"
    +'<p class="card-sum">'+escapeHtml(truncate(it.summary||"",60))+"</p>"
    +'<span class="card-link">查看详情 &rarr;</span></article>';
}
function radarHTML(rows){
  return rows.map((it,n)=>{
    const href = it._idx ? ("#c"+it._idx) : pickHref(it);
    return '<div class="radar-row" data-dom="'+(it._dom?1:0)+'" data-pol="'+(it._pol?1:0)+'" data-rel="'+(it._grp?1:0)+'">'
      +'<div class="r-rank">'+String(n+1).padStart(2,"0")+"</div>"
      +'<div class="r-body"><a class="r-title" href="'+href+'" title="跳到下方第 '+it._idx+' 条">'+escapeHtml(it.title||"")+"</a>"
      +'<div class="r-meta">'+escapeHtml((it.source&&it.source.name)||"")+" · "+escapeHtml(it._time)+" · 相关 "+it._rel+"</div>"
      +'<div class="r-insp">可借鉴：'+escapeHtml(it._insp)+"</div></div></div>";
  }).join("");
}

function relScore(a,b){
  let s=0;
  if(a.category===b.category) s+=1;
  if(a._grp&&a._grp===b._grp) s+=2;
  if(a._dom&&b._dom) s+=1;
  if(a._pol&&b._pol) s+=1;
  return s;
}
function openDrawer(idx){
  const it=state.byIdx&&state.byIdx[idx]; if(!it) return;
  const l=it.links||{}, orig=l.original||"", aihot=l.aihot||"";
  const origOk=orig&&!isBlockedUrl(orig);
  const related=(state.view||[]).filter(function(x){return x._idx!==idx&&relScore(it,x)>0;})
    .sort(function(a,b){return relScore(it,b)-relScore(it,a);}).slice(0,4);
  const saved=SAVED.has(it.title);
  const relHtml=related.length?'<div class="d-related"><h4>同主题还有</h4>'+related.map(function(x){
    return '<a class="d-rel-item" href="#c'+x._idx+'" data-jump="'+x._idx+'">'+escapeHtml(x.title||"")
      +'<span>'+escapeHtml((x.source&&x.source.name)||"")+' · 相关 '+x._rel+'</span></a>';
  }).join("")+'</div>':"";
  document.getElementById("drawerBody").innerHTML=
    '<div class="d-tags">'+tagHTML(it)+'</div>'
    +'<h2 class="d-title">'+escapeHtml(it.title||"")+'</h2>'
    +'<div class="d-meta">'+escapeHtml((it.source&&it.source.name)||"")+' · '+escapeHtml(it._time)+' · 相关 '+it._rel+'</div>'
    +'<p class="d-sum">'+escapeHtml(it.summary||"")+'</p>'
    +'<div class="d-insp">可借鉴：'+escapeHtml(it._insp)+'</div>'
    +'<div class="d-actions">'
      +(origOk?'<a class="d-btn primary" href="'+escapeHtml(orig)+'" target="_blank" rel="noopener noreferrer">阅读原文</a>':"")
      +(aihot?'<a class="d-btn" href="'+escapeHtml(aihot)+'" target="_blank" rel="noopener noreferrer">在 AIHOT 查看</a>':"")
      +'<button class="d-btn" id="dSave">'+(saved?"已加入稍后读":"稍后读")+'</button>'
    +'</div>'+relHtml;
  const d=document.getElementById("drawer");
  d.hidden=false;
  requestAnimationFrame(function(){d.classList.add("open");});
  document.body.style.overflow="hidden";
  document.getElementById("drawerClose").onclick=closeDrawer;
  document.getElementById("drawerMask").onclick=closeDrawer;
  document.getElementById("dSave").onclick=function(){
    if(SAVED.has(it.title)) SAVED.delete(it.title); else SAVED.add(it.title);
    saveSaved(); this.textContent=SAVED.has(it.title)?"已加入稍后读":"稍后读";
    renderAll(); showToast(SAVED.has(it.title)?"已加入稍后读":"已移出稍后读");
  };
  document.querySelectorAll(".d-rel-item").forEach(function(a){
    a.onclick=function(e){
      e.preventDefault(); closeDrawer();
      const t=document.getElementById("c"+a.dataset.jump);
      if(t) t.scrollIntoView({behavior:"smooth",block:"center"});
    };
  });
}
function closeDrawer(){
  const d=document.getElementById("drawer"); if(!d||d.hidden) return;
  d.classList.remove("open");
  setTimeout(function(){d.hidden=true;},220);
  document.body.style.overflow="";
}
function latestMs(){
  let max=0;
  for(const it of (state.items||[])){
    const t=Date.parse(it.publishedAt||it.discoveredAt||"");
    if(t>max) max=t;
  }
  return max;
}
function ageLabel(h){
  if(!isFinite(h)) return "未知";
  if(h<1) return Math.max(1,Math.round(h*60))+" 分钟前";
  if(h<24) return (Math.round(h*10)/10)+" 小时前";
  return Math.round(h/24)+" 天前";
}
function renderAll(){
  const P=PROFILES[state.profile], now=bjNow();
  // 标题用「数据时间」而非浏览器当前时间，避免标题新、内容旧的错觉
  const lt=latestMs(), lp=lt?bjParts(new Date(lt).toISOString()):null;
  const ageH=lt?(Date.now()-lt)/3600000:Infinity;
  const stale=(!isFinite(ageH))||ageH>3;
  const h1=document.getElementById("dateTitle");
  if(lp){
    h1.textContent=lp.y+" 年 "+lp.m+" 月 "+lp.d+" 日 "+WEEK[new Date(Date.UTC(lp.y,lp.m-1,lp.d)).getUTCDay()];
  }else{
    h1.textContent=now.y+" 年 "+now.m+" 月 "+now.d+" 日 "+WEEK[new Date(Date.UTC(now.y,now.m-1,now.d)).getUTCDay()];
  }
  h1.classList.toggle("stale", stale);
  const sub=document.getElementById("subTitle");
  if(sub) sub.textContent = lp
    ? "数据更新于 "+lp.m+" 月 "+lp.d+" 日 "+lp.hh+":"+lp.mm+"（"+ageLabel(ageH)+"）· 共 "+state.items.length+" 条原始条目"
    : "连接 AI HOT 公开接口";
  const badge=document.getElementById("liveBadge");
  badge.textContent=state.live?"实时拉取":"内置快照";
  badge.className="live"+(state.live?"":" off");
  document.getElementById("profileNote").textContent="当前画像："+P.label+" · 权重 领域相关性 "+Math.round(P.w.domain*100)+"% / 热度 "+Math.round(P.w.base*100)+"% / 政策 "+Math.round(P.w.policy*100)+"% / 国内 "+Math.round(P.w.domestic*100)+"%";
  const bnr=document.getElementById("banner");
  if(!state.live && stale && lp){
    bnr.hidden=false;
    bnr.textContent="内置快照已 "+ageLabel(ageH)+"未更新（数据截至 "+lp.m+" 月 "+lp.d+" 日 "+lp.hh+":"+lp.mm+"），内容不代表当前。点右上角「刷新数据」重试。";
  }else if(state.live){
    bnr.hidden=true;
  }

  // 画像按钮
  document.getElementById("profiles").innerHTML=Object.keys(PROFILES).map(k=>'<button data-p="'+k+'" class="'+(k===state.profile?"on":"")+'">'+PROFILES[k].label+"</button>").join("");
  document.querySelectorAll(".filters button[data-f]").forEach(b=>b.classList.toggle("on", b.dataset.f===state.filter));

  const enriched=dedupe(state.items.map(enrich));
  const pool=capEvent(enriched,2);
  const secs=SECTIONS.map(()=>[]);
  for(const it of pool){
    const idx=(it.category in CAT2SEC)?CAT2SEC[it.category]:4;
    secs[idx].push(it);
  }
  secs.forEach(a=>a.sort((x,y)=>y._rel-x._rel));
  const cap=7;
  const shown=secs.map(a=>a.slice(0,cap));

  let gi=0;
  shown.forEach(a=>a.forEach(it=>{gi++;it._idx=gi;}));
  const flat=shown.flat();
  // 曝光计数：同一会话同一标题只记一次
  flat.forEach(function(it){
    if(SESSION_SEEN.has(it.title)) return;
    SESSION_SEEN.add(it.title);
    bump(LEARN.impr.cat,catKey(it),1);
    tagKeys(it).forEach(function(t){bump(LEARN.impr.tag,t,1);});
  });
  saveLearn();
  state.view=flat; state.byIdx={};
  flat.forEach(function(it){state.byIdx[it._idx]=it;});
  const domN=flat.filter(x=>x._dom).length, polN=flat.filter(x=>x._pol).length, relN=flat.filter(x=>x._grp).length;
  document.getElementById("subTitle").textContent="过去 24 小时 · 共 "+flat.length+" 条（已去重）· 国内 "+domN+" 条";
  document.getElementById("stats").innerHTML=
    '<div class="stat">总条数<b>'+flat.length+'</b></div>'+
    '<div class="stat">国内<b>'+domN+'</b></div>'+
    '<div class="stat">政策/协议<b>'+polN+'</b></div>'+
    '<div class="stat">★ 画像相关<b>'+relN+'</b></div>'+
    SECTIONS.map((s,i)=>'<div class="stat sec-stat">'+s[0].replace("发布/更新","")+'<b>'+shown[i].length+'</b></div>').join("");

  // 导航（窄屏用短标签，避免顶到右边缘）
  const narrow=window.matchMedia("(max-width:520px)").matches;
  const shortName=n=>n.replace("发布/更新","").replace("动态","").replace("研究","").replace("与观点","");
  let nav='<a class="nav-pill" href="#radar" style="--c:#7c3aed">'+(narrow?"雷达":"灵感雷达")+'<b>5</b></a>';
  SECTIONS.forEach((s,i)=>{
    const lb=narrow?shortName(s[0]):s[0];
    nav+='<a class="nav-pill" href="#sec-'+i+'" style="--c:'+s[1]+'">'+lb+'<b>'+shown[i].length+"</b></a>";
  });
  document.getElementById("anchors").innerHTML=nav;

  // 雷达
  const radar=flat.slice().sort((a,b)=>(b._rel+(P.bonus[b._grp]||0))-(a._rel+(P.bonus[a._grp]||0))).slice(0,5);
  document.getElementById("radarList").innerHTML=radar.length?radarHTML(radar):'<div class="empty">暂无可用条目</div>';
  document.getElementById("radarDesc").textContent="从本期 "+flat.length+" 条中挑出与「"+P.label+"」最相关、最可能触发灵感的 "+radar.length+" 条，附规则化「可借鉴」提示。";

  // 版块
  document.getElementById("sections").innerHTML=SECTIONS.map((s,i)=>{
    const body=shown[i].length?shown[i].map(it=>cardHTML(it._idx,it)).join(""):'<div class="empty">本期暂无该版块条目</div>';
    return '<section id="sec-'+i+'" class="section"><h2 class="sec-head" style="--c:'+s[1]+'"><span class="dot" style="background:'+s[1]+'"></span>'+s[0]+'<span class="sec-count">'+shown[i].length+'</span></h2><div class="grid">'+body+"</div></section>";
  }).join("");

  if(location.search.includes("debug=1")){
    const b=document.getElementById("banner"); b.hidden=false;
    b.textContent="DEBUG dim="+document.documentElement.scrollWidth+"x"+document.documentElement.clientWidth+" "+JSON.stringify(flat.filter(x=>x._grp).map(x=>[x._grp,(x.title||"").slice(0,20)]));
  }
  renderLearnLine();
  applyFilter();
  bindProfile();
}

function applyFilter(){
  const f=state.filter;
  document.querySelectorAll(".card,.radar-row").forEach(c=>{
    let ok=true;
    if(f==="dom") ok=c.dataset.dom==="1";
    if(f==="pol") ok=c.dataset.pol==="1";
    if(f==="rel") ok=c.dataset.rel==="1";
    if(f==="saved") ok=SAVED.has(c.dataset.title);
    c.style.display=ok?"":"none";
  });
  document.querySelectorAll(".section").forEach(s=>{
    const any=[...s.querySelectorAll(".card")].some(c=>c.style.display!=="none");
    s.style.display=any?"":"none";
  });
  const rd=document.querySelector(".radar");
  if(rd){
    const any=[...rd.querySelectorAll(".radar-row")].some(c=>c.style.display!=="none");
    rd.style.display=any?"":"none";
  }
}
function bindProfile(){
  document.querySelectorAll("#profiles button").forEach(b=>{
    b.onclick=()=>{state.profile=b.dataset.p;renderAll();};
  });
}

document.querySelectorAll(".filters button[data-f]").forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll(".filters button[data-f]").forEach(x=>x.classList.remove("on"));
    b.classList.add("on");
    state.filter=b.dataset.f;
    applyFilter();
  };
});
document.getElementById("refreshBtn").onclick=loadData;
window.addEventListener("resize",function(){clearTimeout(window.__rz);window.__rz=setTimeout(renderAll,150);});

// 点击卡片：记录类别 / 标签点击，作为后续排序的轻量信号
document.addEventListener("click",function(e){
  const a=e.target.closest(".card");
  if(!a) return;
  const cat=a.dataset.cat||"other";
  const tags=(a.dataset.tags||"").split(",").filter(Boolean);
  bump(LEARN.clicks.cat,cat,1);
  tags.forEach(function(t){bump(LEARN.clicks.tag,t,1);});
  saveLearn(); renderLearnLine();
  openDrawer(a.dataset.idx);
});
document.addEventListener("keydown",function(e){
  if(e.key==="Escape"){closeDrawer();return;}
  if((e.key==="Enter"||e.key===" ")&&e.target.classList&&e.target.classList.contains("card")){
    e.preventDefault(); e.target.click();
  }
});

loadData();
