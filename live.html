ML 发布 Ternary Bonsai 2.5 27B：约 1/9 体积保留 93.7% 编程能力，手机电脑可跑","summary":"美国 AI 公司 PrismML 于 11 月 24 日发布 Ternary Bonsai 2.5 27B 模型，基于 Qwen3.8 27B 基座，采用权重仅取 -1、0、1 的三值量化，最紧凑格式下仅占 5.9GB 内存，约为全精度版本（约 53.8GB）的九分之一，保留约 93.7% 的 SWE-bench Verified 得分（75.6 对 80.6）。","source":{"name":"IT之家·人工智能"},"category":"ai-models","score":62,"publishedAt":"2026-11-25T05:36:32.167Z","discoveredAt":"2026-11-25T05:57:25.578Z","selected":false,"links":{"aihot":"https://aihot.news/items/ppktjkehrqbtl7m1f5yi9gvan","original":"https://www.ithome.com/1/032/101.htm"}},{"title":"MIT 与 Microsoft 论文：GitHub Copilot 使初级软件工程师招聘下降约 40%","summary":"MIT 和 Microsoft 的新论文《AI-Assisted Programming and Labor Demand》利用 5,414 家跨国公司（覆盖 38% 美国程序员）的 GitHub 合同审查时点构造自然实验，估计 Copilot 采用对劳动力需求的影响。","source":{"name":"X：Rohan Paul (@rohanpaul_ai)"},"category":"paper","score":77,"publishedAt":"2026-11-25T05:29:48.000Z","discoveredAt":"2026-11-25T05:43:23.738Z","selected":true,"links":{"aihot":"https://aihot.news/items/hyofqy3ukzks1eyr4bu317bez","original":"https://x.com/rohanpaul_ai/status/2125461932111229203"}},{"title":"Rohan Paul 评 Kaggle 复现的 ShellBench：智能体失败多因遗漏已收集的信息","summary":"Rohan Paul 转评 Kaggle 与 OpenClaw、Parsewaveai 合作复现的 ShellBench 基准，该基准用 100 项真实个人 AI 任务评估前沿模型。其数据显示 51% 的失败任务涉及信息遗漏，其中 87% 的信息智能体已经收集到；GPT-6 Astra 在 5 个 harness 平均下至少一次通过 75.1% 的任务，三项全部通过为 48.8%。榜单见 https://www.kaggle.com/benchmarks/openclaw-foundation/shellbench","source":{"name":"X：Rohan Paul (@rohanpaul_ai)"},"category":"paper","score":56,"publishedAt":"2026-11-25T05:40:06.000Z","discoveredAt":"2026-11-25T05:43:23.731Z","selected":false,"links":{"aihot":"https://aihot.news/items/ia14rp1da3s7lsog103kesjs8","original":"https://x.com/rohanpaul_ai/status/2125464526149890399"}},{"title":"Perplexity 内 Gemini 4 Neon 周二消耗 44.52B tokens，超周一全天 23.5%","summary":"Perplexity CEO Aravind Srinivas 称周二 Gemini 4 Neon 在 Perplexity 内消耗 44.52B tokens，距当日结束还有 3 小时以上，已比周一全天 36.06B 高 23.5%。他表示很久没在 Perplexity 内见过如此快的模型日环比增长，其引用内容提到 3 天内日 token 量翻倍至 120B，并将 Neon 智能体水平定位在 Opus 与 Fable 之间。","source":{"name":"X：Aravind Srinivas（Perplexity CEO） (@AravSrinivas)"},"category":"industry","score":52,"publishedAt":"2026-11-25T05:16:43.000Z","discoveredAt":"2026-11-25T05:30:24.171Z","selected":false,"links":{"aihot":"https://aihot.news/items/hnk77zmg3vdso055pjmnbcmte","original":"https://x.com/AravSrinivas/status/2125458638823379123"}},{"title":"OpenClaw 发布 ShellBench 智能体基准","summary":"这看起来是一个相当难的智能体基准测试，刚刚发布。\n\n“即便是表现最好的模型，也只成功完成了大约 10 个任务中的 6 个。”\n\n这是来自 OpenClaw 及其合作伙伴的 ShellBench，一个新基准，给 AI 智能体布置人们实际会交给它们的琐碎杂活，比如在一个装有 188 个文件的文件夹里核对收据与电子表格。\n\n即便是最好的智能体 GPT-6 Astra，也仅完全完成了其中 62.5%，也就是说大约 10 个日常任务中仍有 4 个未能完成。","source":{"name":"X：Rohan Paul (@rohanpaul_ai)"},"category":"paper","score":45,"publishedAt":"2026-11-25T05:01:23.000Z","discoveredAt":"2026-11-25T05:12:27.893Z","selected":false,"links":{"aihot":"https://aihot.news/items/nxz9eo4ti0up724wa8ivvk758","original":"https://x.com/rohanpaul_ai/status/2125454780026011734"}},{"title":"Meta 天价薪酬对顶尖研究员近乎\"净中性\"","summary":"Meta 开出的巨额薪酬方案对顶尖研究员来说大致是\"净中性\"的\n\n- Alexandr Wang（Meta 首席 AI 官、Scale AI 联合创始人）\n\nMeta 向 AI 研究员开出的著名巨额报价，对其中许多人来说并非真正的涨薪，因为他们在 OpenAI 和 Anthropic 的股票已涨了太多，留下来的收入差不多\n\n所以真正的吸引力是使命\n\n----\n完整视频在 \"David Senra\" YouTube 频道，（链接在评论中）","source":{"name":"X：Rohan Paul (@rohanpaul_ai)"},"category":"industry","score":48,"publishedAt":"2026-11-25T05:08:44.000Z","discoveredAt":"2026-11-25T05:12:27.886Z","selected":false,"links":{"aihot":"https://aihot.news/items/q0wjlrv9bzni1aicnrbut3u03","original":"https://x.com/rohanpaul_ai/status/2125456631966335471"}},{"title":"高盛：美国数据中心建设热潮有望持续至 2028 年，推高电力与天然气需求","summary":"高盛预计，受人工智能热潮推动，美国数据中心电力容量的强劲增长将持续至 2028 年，届时有望新增 52 吉瓦。今年以来美国数据中心电力容量及需求增长近 30%，贡献了美国电力需求总增量的三分之一以上。这一扩张可能加剧电力市场供应紧张并推高天然气需求，强化高盛对 2028 至 2030 年亨利枢纽天然气价格的看涨预期。","source":{"name":"IT之家·人工智能"},"category":"industry","score":48,"publishedAt":"2026-11-25T04:33:29.027Z","discoveredAt":"2026-11-25T04:54:22.766Z","selected":false,"links":{"aihot":"https://aihot.news/items/pjk6yhv news/items/zd33x54v9o543gv5golsi1qtg","original":"https://x.com/rohanpaul_ai/status/2125354301468151959"}},{"title":"Harvard 与 Anthropic 论文发现多智能体团队安全性低于单智能体","summary":"Harvard 与 Anthropic 的论文发现，多智能体团队比单智能体更不安全，主因是职责分散，没有智能体负责系统级安全。在脓毒症分诊任务上，9 个 Mythos Preview 智能体组成团队的 safet 得分比单智能体低约 59 分；同行评审、群聊等干预无效，只有指定安全负责人并发布共享安全文档能可靠恢复到单智能体安全水平。","source":{"name":"X：Rohan Paul (@rohanpaul_ai)"},"category":"paper","score":67,"publishedAt":"2026-11-24T22:29:28.000Z","discoveredAt":"2026-11-24T22:32:30.652Z","selected":false,"links":{"aihot":"https://aihot.news/items/bt67lt2q9fb5hr5va241tw2bf","original":"https://x.com/rohanpaul_ai/status/2125356153299415284"}},{"title":"Dwarkesh Patel 回应关于递归自我改进与 2030 超级智能预测的质疑","summary":"Dwarkesh Patel 与 Max Farrens 在播客中逐条回应外界对其递归自我改进论文的反对意见，重申预计 2028 年完全自动化顶级 AI 研究者、约 2029 年实现超级智能，并给出明年约 25% 的可能性。","source":{"name":"Dwarkesh Patel：Podcast & Blog（RSS）"},"category":"opinion","score":56,"publishedAt":"2026-11-24T21:45:30.000Z","discoveredAt":"2026-11-24T22:30:27.897Z","selected":false,"links":{"aihot":"https://aihot.news/items/u82amh8lvbjld3i19cz6c9dks","original":"https://www.dwarkesh.com/p/rsiobjections"}},{"title":"Conductor 推出 Electron 版","summary":"Conductor 现在是 Electron 应用了！\n\n我们用 Electron 重建了前端，保留了 Rust 本地服务器。这事我们聊了好几个月，现在直接……提示它就行。\n\n- 打开工作区快了 71%\n- 启动到渲染快 4.6 倍\n- 内存占用减少 35%\n- 唯一缺点是下载包更大（500mb，之前约 200mb）","source":{"name":"X：Charlie Holtz（@charlieholtz）"},"category":"ai-products","score":50,"publishedAt":"2026-11-24T22:10:10.000Z","discoveredAt":"2026-11-24T22:26:28.752Z","selected":false,"links":{"aihot":"https://aihot.news/items/griph4nbawls6kfmkjjibwj43","original":"https://x.com/charlieholtz/status/2125351294965805147"}},{"title":"OpenRouter 用 agent 测试新模型","summary":"想知道新模型是否适合你的任务，最好的办法就是在你的任务上实际测试它们。\n\n这里有一个简单的方法，让你的 agent 在 OpenRouter 上通过 generation/content 端点完成这件事。\n\n这个示例使用了特定的 generation id，但你可以用自己选择的日志/追踪方法，轻松地在多个 generation 上运行同样的流程。\n\n注意，你需要在 OpenRouter 设置中开启输入与输出日志记录，这才能生效。","source":{"name":"X：OpenRouter (@OpenRouter)"},"category":"tip","score":42,"publishedAt":"2026-11-24T22:00:05.000Z","discoveredAt":"2026-11-24T22:20:20.363Z","selected":false,"links":{"aihot":"https://aihot.news/items/prpuj3kzf01n5fts4q1rb730g","original":"https://x.com/OpenRouter/status/2125348756027842934"}},{"title":"Higgsfield MAGI-2 模型体验入口","summary":"在 playground 中进一步了解 MAGI-2：\n\nhttps://open.higgsfield.ai/models/sand/magi-2/text-to-video/playground","source":{"name":"X：Higgsfield AI (@higgsfield)"},"category":"ai-products","score":43,"publishedAt":"2026-11-24T21:48:12.000Z","discoveredAt":"2026-11-24T22:10:28.824Z","selected":false,"links":{"aihot":"https://aihot.news/items/v11ekle5qdm2odmqsgntfci8b","original":"https://x.com/higgsfield/status/2125345768433410085"}},{"title":"Sand.ai 发布 MAGI-2 视频模型，居 Higgsfield Video Arena 第二名","summary":"Sand.ai 的 MAGI-2 在 Higgsfield Video Arena 排名第 2，得分 1146，整体胜率 60.5%，400B 参数开源权重即将推出。盲测中对 Seedance 2.0 胜率 71%，对 Wan 3.0 为 79%，对 Kling 4.0 为 83%。据引用内容，MAGI-2 可将文本、图像、视频和音频转为最长 30 秒的 1080p 带声视频，定价 $0.08 每秒，现已上线 Higgsfield 平台及 API。","source":{"name":"X：Higgsfield AI (@higgsfield)"},"category":"ai-models","score":63,"publishedAt":"2026-11-24T21:49:35.000Z","discoveredAt":"2026-11-24T22:10:28.776Z","selected":false,"links":{"aihot":"https://aihot.news/items/ehk19nq9c6bga41oywf0ah6xo","original":"https://x.com/higgsfield/status/2125346114690060390"}},{"title":"Anthropic 数学家 Alpöge 与 Claude 合作给出黎曼猜想 Lean 证明","summary":"Anthropic 数学家 Levent Alpöge 与 NYU 教授 Tristan Buckmaster 于 11 月 20 日宣布找到强于 OpenAI 9 月版本的 Navier-Stokes 解；同日 Alpöge 宣布与 Claude 合作发现黎曼猜想证明，以 Lean 语言写成 1700 万行代码，独立数学家用多个 Lean 验证器确认各步骤有效。","source":{"name":"Timothy B. Lee：Understanding AI（RSS）"},"category":"industry","score":83,"publishedAt":"2026-11-24T21:43:33.000Z","discoveredAt":"2026-11-24T22:04:29.967Z","selected":false,"links":{"aihot":"https://aihot.news/items/ervufyg7j8jzllqjxg3gd6zvf","original":"https://www.understandingai.org/p/an-anthropic-mathematician-just-solved"}},{"title":"WhiteCircle 推出 Halo 后 y","score":50,"publishedAt":"2026-11-24T18:47:57.000Z","discoveredAt":"2026-11-24T19:25:21.527Z","selected":false,"links":{"aihot":"https://aihot.news/items/xrti6j6e2shyyvhmmb0djqjth","original":"https://arstechnica.com/gadgets/2026/11/faa-opens-probe-after-amazon-delivery-drone-clips-cable-crashes-into-garage/"}},{"title":"ChatGPT Business 获重置与快速模式","summary":"致所有 ChatGPT Business 团队。我们为你们准备了两项小福利：一次可存储的重置机会，以及截至 12 月 31 日免费使用的快速模式。玩得开心！","source":{"name":"X：Tibo (@thsottiaux)"},"category":"ai-products","score":41,"publishedAt":"2026-11-24T18:43:21.000Z","discoveredAt":"2026-11-24T19:11:21.403Z","selected":false,"links":{"aihot":"https://aihot.news/items/pfcfdoo56p8ib66uf7r4pmttv","original":"https://x.com/thsottiaux/status/2125299248782778588"}},{"title":"GPT-6.2 Astra 用 22 分钟破解 1808 年素描画作者之谜","summary":"研究者引述案例称，GPT-6.2 Astra 仅用 22 分钟和公开资料，将耶鲁 Beinecke 图书馆藏的 1808 年蒙特利尔至苏必利尔湖匿名素描画作者鉴定为 vicomte de Chabot，并找到其微缩胶片日记供验证。日记笔迹与素描题注吻合，1808 年 6 月 18 日日记明确写下“我画了一幅素描”；作者认为这标志着模型的研究发现能力正从数学等可验证领域扩展到历史等非确定性领域。","source":{"name":"X：Greg Brockman (@gdb)"},"category":"opinion","score":68,"publishedAt":"2026-11-24T19:06:54.000Z","discoveredAt":"2026-11-24T19:10:23.169Z","selected":true,"links":{"aihot":"https://aihot.news/items/eb9lfibaf8fpouyw0x3vh63st","original":"https://x.com/gdb/status/2125305172721320165"}},{"title":"OpenAI 分享两位天文爱好者用 AI 发现系外行星信号","summary":"两位业余天文学家 Kevin Bond（@canvrno）和 Ethan Byrd（@itsjustemail）各自独立发现了可能指向遥远恒星周围行星的信号。他们知道，这类搜寻并不需要拥有自己的望远镜。\n\nKevin 使用 Codex，Ethan 使用 Astra，在公开的望远镜数据中搜寻由环绕行星引起的微小、周期性星光变暗。两人都发现了值得进一步研究的信号。","source":{"name":"X：OpenAI (@OpenAI)"},"category":"tip","score":46,"publishedAt":"2026-11-24T19:08:37.000Z","discoveredAt":"2026-11-24T19:10:22.657Z","selected":false,"links":{"aihot":"https://aihot.news/items/zyzlj1f00jgy2vzuyrxanb8lk","original":"https://x.com/OpenAI/status/2125305606685053416"}},{"title":"Codex 助力发现疑似系外行星信号","summary":"Kevin 用 Codex 构建了一个程序，从 NASA 开普勒望远镜中检索约 10 万颗恒星的观测数据。天琴座中有一颗恒星每 13.8 天变暗一次。如果是一颗行星造成了这种亮度下降，其遮挡的光量表明它的直径约为地球的 2.4 倍。\n\nSETI 研究所的一位天文学家独立发现了相同的信号，以及 Kevin 标记出的另一个信号。对于天琴座的这颗恒星，天文学家现在知道何时观测下一次亮度下降。","source":{"name":"X：OpenAI (@OpenAI)"},"category":"tip","score":50,"publishedAt":"2026-11-24T19:08:38.000Z","discoveredAt":"2026-11-24T19:10:22.652Z","selected":false,"links":{"aihot":"https://aihot.news/items/ak7gf2im7ubs2ac39z3y2lqiv","original":"https://x.com/OpenAI/status/2125305608597590018"}},{"title":"OpenAI Astra 助高中生搜寻 1900 万恒星系外行星","summary":"OpenAI 分享高中生 Ethan 用 Astra 审查已发表方法并编写软件，搜索 NASA TESS 任务约 1900 万颗恒星的观测数据，范围包括恒星周围可能让行星表面存在液态水的区域。首轮筛选得到 49 个候选目标，其中最有希望的一个已提交给 NASA TESS 任务研究人员，等待进一步查看。","source":{"name":"X：OpenAI (@OpenAI)"},"category":"tip","score":49,"publishedAt":"2026-11-24T19:08:38.000Z","discoveredAt":"2026-11-24T19:10:22.644Z","selected":false,"links":{"aihot":"https://aihot.news/items/kv31irb5beds21rv800f3bwfz","original":"https://x.com/OpenAI/status/2125305610678010244"}},{"title":"Cognition 发布 SWE-2.1 及高速版 SWE-2.1 Lightning","summary":"Cognition 发布 SWE-2.1，基于 Kimi K3 纯强化学习训练，在 FrontierCode 2.0、Terminal-Bench 4.1 等基准上较 SWE-2 大幅提升，ExploitBench 达 80%、ExploitGym 捕获 27.3% flags，网络安全能力显著增强。","source":{"name":"Cognition 模型 / Devin 博客（网页）"},"category":"ai-models","score":68,"publishedAt":"2026-11-23T16:00:00.000Z","discoveredAt":"2026-11-24T19:08:22.158Z","selected":true,"links":{"aihot":"https://aihot.news/items/gflb0kkwzma61spkzpp1uxmrk","original":"https://cognition.com/blog/swe-2-1"}},{"title":"Hugging Face CEO 称开源在法律领域已达前沿","summary":"开源在法律领域就是前沿！","source":{"name":"X：Clément Delangue（Hugging Face CEO） (@ClementDelangue)"},"category":"ai-models","score":46,"publishedAt":"2026-11-24T18:44:06.000Z","discoveredAt":"2026-11-24T19:02:20.495Z","selected":false,"links":{"aihot":"https://aihot.news/items/m81ytg39ppcgpe4tjbkymk63k","original":"https://x.com/ClementDelangue/status/2125299436331106426"}},{"title":"Transluce 推出 PosteriorBench：评测语言模型行为后验采样方法","summary":"Transluce 发布 PosteriorBench，用于比较语言模型行为后验采样方法的计算成本与对真实后验的逼近程度。基准基于 Qwen3.5-0.8B 采样十亿条回复构建 21 const CAT_LABEL={"ai-models":"模型","ai-products":"产品","industry":"行业","paper":"论文","tip":"技巧","opinion":"观点","other":"其他"};
function loadLearn(){
  try{
    const o=JSON.parse(localStorage.getItem(LEARN_KEY));

function saveLearn(){try{localStorage.setItem(LEARN_KEY,JSON.stringify(LEARN));}catch(e){}}
function bump(o,k,n){o[k]=(o[k]||0)+n;}
function catKey(it){return it.category||"other";}
function tagKeys(it){const a=[];if(it._dom)a.push("dom");if(it._pol)a.push("pol");if(it._eco)a.push("eco");if(it._grp)a.push("theory");return a;}
function aff(kind,key){const c=(LEARN.clicks[kind]||{})[key]||0;const i=(LEARN.impr[kind]||{})[key]||0;return (c+0.5)/(i+5);}
function learnBoost(it){
  if(!LEARN.on) return 0;
  const catAff=aff("cat",catKey(it));
  const tags=tagKeys(it);
  const tagAff=tags.length?tags.reduce((s,t)=>s+aff("tag",t),0)/tags.length:0;
  return Math.round(LEARN_MAX*(0.6*catAff+0.4*tagAff));
}

function escapeHtml(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function truncate(s,n){s=(s||"").trim();return s.length<=n?s:s.slice(0,n-1)+"…";}
function norm(s){return (s||"").toLowerCase().replace(/[^\w\u4e00-\u9fff]+/g,"");}
function hasKw(t,k){
  if(/[a-z0-9]/.test(k)){
    const escK=k.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
    return new RegExp("(?<![a-z0-9])"+escK+"(?![a-z0-9])","i").test(t);
  }
  return t.includes(k);
}
function bjParts(iso){
  const d=new Date(iso); if(!iso||isNaN(d)) return null;
  const b=new Date(d.getTime()+8*3600*1000);
  return {y:b.getUTCFullYear(),m:b.getUTCMonth()+1,d:b.getUTCDate(),hh:String(b.getUTCHours()).padStart(2,"0"),mm:String(b.getUTCMinutes()).padStart(2,"0")};
}
function bjNow(){const b=new Date(Date.now()+8*3600*1000);return {y:b.getUTCFullYear(),m:b.getUTCMonth()+1,d:b.getUTCDate()};}
function timeLabel(it){
  const p=bjParts(it.publishedAt||it.discoveredAt); if(!p) return "";
  const n=bjNow();
  if(p.y===n.y&&p.m===n.m&&p.d===n.d) return "今天 "+p.hh+":"+p.mm;
  const yb=new Date(Date.now()+8*3600*1000-86400000);
  if(p.y===yb.getUTCFullYear()&&p.m===yb.getUTCMonth()+1&&p.d===yb.getUTCDate()) return "昨天 "+p.hh+":"+p.mm;
  return p.m+" 月 "+p.d+" 日 "+p.hh+":"+p.mm;
}
function bigrams(s){
  const t=norm(s), set=new Set();
  for(let i=0;i<t.length-1;i++) set.add(t.slice(i,i+2));
  return set;
}
function sim(a,b){
  const A=bigrams(a),B=bigrams(b);
  if(!A.size||!B.size) return 0;
  let n=0; for(const x of A) if(B.has(x)) n++;
  return n/Math.min(A.size,B.size); // 重叠系数：对中文改写/长短不一更稳
}
function hasSharedName(a,b){
  const re=/[A-Za-z][A-Za-z0-9.\-]{3,}/g;
  const A=new Set((a.match(re)||[]).map(x=>x.toLowerCase()));
  const B=new Set((b.match(re)||[]).map(x=>x.toLowerCase()));
  const stop=new Set(["openai","google","anthropic","microsoft","deepmind","model","models","release","update","launch","agent","agents","artificial","analysis","research","report"]);
  return [...A].some(x=>B.has(x)&&!stop.has(x));
}
function vkeys(t){return new Set((t.match(/[A-Za-z][A-Za-z0-9.\-]{1,}\s?\d+(?:\.\d+)?/g)||[]).map(x=>x.toLowerCase().replace(/\s/g,"")));}

function enrich(it){
  const text=((it.title||"")+" "+(it.summary||"")).toLowerCase();
  const dom=DOM_CONTENT_RE.test((it.title||"")+" "+(it.summary||""));
  const pol=POLICY.some(k=>hasKw(text,k));
  const eco=ECO.some(k=>hasKw(text,k));
  const P=PROFILES[state.profile];
  let grp=null;
  // 论文直接计入「前沿理论」，不依赖标题关键词
  if(P.groups.indexOf("theory")>=0 && it.category==="paper") grp="theory";
  if(!grp){ for(const g of P.groups){ if(DOMAINS[g].some(k=>hasKw(text,k))){grp=g;break;} } }
  const sc=it.score||0, w=P.w;
  const raw=w.base*(sc/100)+(grp?w.domain:0)+(pol?w.policy:0)+(dom?w.domestic:0)+(eco?w.eco:0);
  const rel0=Math.round(Math.max(0,Math.min(1,raw))*100);
  let insp=P.insp[grp];
  if(!insp) insp=pol?"政策 / 协议信号，可能影响选题方向与合规边界。":(eco?"开源 / 生态动向，影响后续工具链选型。":"可作为选题或技术选型的背景参考。");
  const out=Object.assign({},it,{_dom:dom,_pol:pol,_eco:eco,_grp:grp,_rel:rel0,_time:timeLabel(it),_insp:insp});
  out._rel=Math.min(100, rel0 + learnBoost(out));
  return out;
}

function dedupe(items){
  const sorted=items.slice().sort((a,b)=>b._rel-a._rel||(b.score||0)-(a.score||0));
  const kept=[];
  for(const it of sorted){
    const t=norm(it.title), vk=vkeys(it.title||"");
    let dup=false;
    for(const k of kept){
      const o=sim(t,norm(k.title));
      if(t===norm(k.title)){dup=true;break;}
      if(o>0.72){dup=true;break;}
      if(o>0.55&&hasSharedName(it.title||"",k.title||"")){dup=true;break;}
      if(it.category===k.category&&vk.size&&[...vk].some(x=>vkeys(k.title||"").has(x))){dup=true;break;}
    }
    if(!dup) kept.push(it);
  }
  return kept;
}
function capEvent(items,limit){
  const cnt={},out=[];
  for(const it of items){
    const ks=vkeys(it.title||""), key=ks.size?[...ks].sort()[0]:null;
    if(key===null){out.push(it);continue;}
    if((cnt[key]||0)<limit){cnt[key]=(cnt[key]||0)+1;out.push(it);}
  }
  return out;
}

  document.querySelectorAll(".filters button[data-f]").forEach(b=>b.classList.toggle("on", b.dataset.f===state.filter));

  flat.forEach(function(it){state.byIdx[it._idx]=it;});
  const domN=flat.filter(x=>x._dom).length, polN=flat.filter(x=>x._pol).length, relN=flat.filter(x=>x._grp).length;
  document.getElementById("subTitle").textContent="过去 24 小时 · 共 "+flat.length+" 条（已去重）· 国内 "+domN+" 条";
  document.getElementById("stats").innerHTML=
    '<div class="stat">总条数<b>'+flat.length+'</b></div>'+
    '<div class="stat">国内<b>'+domN+'</b></div>'+
    '<div class="stat">政策/协议<b>'+polN+'</b></div>'+
    '<div class="stat">★ 画像相关<b>'+relN+'</b></div>'+
    SECTIONS.map((s,i)=>'<div class="stat sec-stat">'+s[0].replace("发布/更新","")+'<b>'+shown[i].length+'</b></div>').join("");

  // 导航（窄屏用短标签，避免顶到右边缘）
  const narrow=window.matchMedia("(max-width:520px)").matches;
  const shortName=n=>n.replace("发布/更新","").replace("动态","").replace("研究","").replace("与观点","");
  let nav='<a class="nav-pill" href="#radar" style="--c:#7c3aed">'+(narrow?"雷达":"灵感雷达")+'<b>5</b></a>';
  SECTIONS.forEach((s,i)=>{
    const lb=narrow?shortName(s[0]):s[0];
    nav+='<a class="nav-pill" href="#sec-'+i+'" style="--c:'+s[1]+'">'+lb+'<b>'+shown[i].length+"</b></a>";
  });
  document.getElementById("anchors").innerHTML=nav;

  // 雷达
  const radar=flat.slice().sort((a,b)=>(b._rel+(P.bonus[b._grp]||0))-(a._rel+(P.bonus[a._grp]||0))).slice(0,5);
  document.getElementById("radarList").innerHTML=radar.length?radarHTML(radar):'<div class="empty">暂无可用条目</div>';
  document.getElementById("radarDesc").textContent="从本期 "+flat.length+" 条中挑出与「"+P.label+"」最相关、最可能触发灵感的 "+radar.length+" 条，附规则化「可借鉴」提示。";

  // 版块
  document.getElementById("sections").innerHTML=SECTIONS.map((s,i)=>{
    const body=shown[i].length?shown[i].map(it=>cardHTML(it._idx,it)).join(""):'<div class="empty">本期暂无该版块条目</div>';
    return '<section id="sec-'+i+'" class="section"><h2 class="sec-head" style="--c:'+s[1]+'"><span class="dot" style="background:'+s[1]+'"></span>'+s[0]+'<span class="sec-count">'+shown[i].length+'</span></h2><div class="grid">'+body+"</div></section>";
  }).join("");

  if(location.search.includes("debug=1")){
    const b=document.getElementById("banner"); b.hidden=false;
    b.textContent="DEBUG dim="+document.documentElement.scrollWidth+"x"+document.documentElement.clientWidth+" "+JSON.stringify(flat.filter(x=>x._grp).map(x=>[x._grp,(x.title||"").slice(0,20)]));
  }
  renderLearnLine();
  applyFilter();
  bindProfile();
}

function applyFilter(){
  const f=state.filter;
  document.querySelectorAll(".card,.radar-row").forEach(c=>{
    let ok=true;
    if(f==="dom") ok=c.dataset.dom==="1";
    if(f==="pol") ok=c.dataset.pol==="1";
    if(f==="rel") ok=c.dataset.rel==="1";
    if(f==="saved") ok=SAVED.has(c.dataset.title);
    c.style.display=ok?"":"none";
  });
  document.querySelectorAll(".section").forEach(s=>{
    const any=[...s.querySelectorAll(".card")].some(c=>c.style.display!=="none");
    s.style.display=any?"":"none";
  });
  const rd=document.querySelector(".radar");
  if(rd){
    const any=[...rd.querySelectorAll(".radar-row")].some(c=>c.style.display!=="none");
    rd.style.display=any?"":"none";
  }
}
function bindProfile(){
  document.querySelectorAll("#profiles button").forEach(b=>{
    b.onclick=()=>{state.profile=b.dataset.p;renderAll();};
  });
}

document.querySelectorAll(".filters button[data-f]").forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll(".filters button[data-f]").forEach(x=>x.classList.remove("on"));
    b.classList.add("on");
    state.filter=b.dataset.f;
    applyFilter();
  };
});
document.getElementById("refreshBtn").onclick=loadData;
window.addEventListener("resize",function(){clearTimeout(window.__rz);window.__rz=setTimeout(renderAll,150);});

// 点击卡片：记录类别 / 标签点击，作为后续排序的轻量信号
document.addEventListener("click",function(e){
  const a=e.target.closest(".card");
  if(!a) return;
  const cat=a.dataset.cat||"other";
  const tags=(a.dataset.tags||"").split(",").filter(Boolean);
  bump(LEARN.clicks.cat,cat,1);
  tags.forEach(function(t){bump(LEARN.clicks.tag,t,1);});
  saveLearn(); renderLearnLine();
  openDrawer(a.dataset.idx);
});
document.addEventListener("keydown",function(e){
  if(e.key==="Escape"){closeDrawer();return;}
  if((e.key==="Enter"||e.key===" ")&&e.target.classList&&e.target.classList.contains("card")){
    e.preventDefault(); e.target.click();
  }
});

loadData();
</script>
</body>
</html>
